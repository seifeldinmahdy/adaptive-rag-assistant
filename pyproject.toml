[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-rag-assistant"
version = "1.0.0"
description = "A stateful, conditional and cyclic LangGraph research assistant using Ollama Cloud"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=1.0,<2", "httpx>=0.28,<1", "pydantic>=2.10,<3",
  "python-dotenv>=1.0,<2", "rank-bm25>=0.2.2,<0.3",
  "streamlit>=1.40,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["adaptive_rag*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
